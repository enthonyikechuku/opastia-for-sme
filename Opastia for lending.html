<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Opastia for lending</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter+Tight:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEF2F4;--surface:#FFFFFF;--ink:#10262E;--muted:#5B6E76;--line:#D6DFE3;
  --accent:#2F43C9;--accent-ink:#FFFFFF;--good:#17805A;--tint:#E6EAFB;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1519;--surface:#142127;--ink:#E7EEF1;--muted:#93A6AE;--line:#25363D;
  --accent:#8C9BFF;--accent-ink:#0C1519;--good:#4CC38F;--tint:#1B2650;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1519;--surface:#142127;--ink:#E7EEF1;--muted:#93A6AE;--line:#25363D;
  --accent:#8C9BFF;--accent-ink:#0C1519;--good:#4CC38F;--tint:#1B2650;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Inter Tight",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
.top{margin-bottom:14px}
.brand{font:700 20px "Bricolage Grotesque",sans-serif}
.note{color:var(--muted);font-size:13px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0 16px}
.tab{border:1px solid var(--line);background:transparent;padding:6px 12px;border-radius:6px;font-weight:500;font-size:14px}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.app{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.bar{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);font-weight:600}
.bar span{color:var(--muted);font-weight:400;font-size:14px}
.body{padding:20px 18px 22px}
h2{font:700 20px "Bricolage Grotesque",sans-serif;margin:0 0 4px}
.big{font:700 44px/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.03em;margin:6px 0 14px}
input[type=range]{width:100%;accent-color:var(--accent)}
.rows{margin:14px 0;border-top:1px solid var(--line)}
.rows div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.rows span:first-child{color:var(--muted)}
.rows b{font-weight:600;text-align:right}
ul{margin:6px 0 16px;padding-left:18px;font-size:14px}
.cta{display:block;width:100%;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:12px;font-weight:600;font-size:16px}
.cta.o{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.track{height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin:12px 0 6px}
.fill{height:100%;background:var(--good);border-radius:6px;transition:width .3s}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
.split{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.log{margin:14px 0;font-size:14px;color:var(--muted);min-height:21px}
.ok{color:var(--good);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Business funding</div>
    <div class="note">What a small business sees inside a partner’s app. Pick a partner to compare. Sample data and sample pricing.</div>
  </div>
  <div class="tabs" id="tabs" role="group" aria-label="Partner type"></div>
  <div class="app" aria-live="polite">
    <div class="bar"><div id="app"></div><span>Adaeze Fabrics</span></div>
    <div class="body" id="body"></div>
  </div>
</div>

<script>
const P={
 pos:{tab:"Card machine provider",app:"TillPoint",max:400000,daily:45000,share:15,how:"15% of each card sale",
  why:["Card sales in 12 of the last 12 months","Sales are rising steadily","Very few refunds"]},
 bank:{tab:"Bank",app:"Meridian Bank",max:600000,daily:38000,share:20,how:"20% of each transfer you receive",
  why:["Steady money coming into your account","Bills and suppliers paid on time","No overdrafts in 12 months"]},
 momo:{tab:"Mobile money",app:"SwiftWallet",max:250000,daily:30000,share:15,how:"15% of each payment you receive",
  why:["Payments received on most days","Regular airtime top-ups","Customers pay you from many different wallets"]}
};
const FEE=0.05;
const $=id=>document.getElementById(id);
const fmt=n=>"₦"+Math.round(n).toLocaleString("en-US");
let key="pos",stage="offer",amt=200000,repaid=0,days=0,last="";
function p(){return P[key]}
function total(){return amt*(1+FEE)}
function tabs(){
  $("tabs").innerHTML="";
  for(const k in P){const b=document.createElement("button");b.className="tab";b.textContent=P[k].tab;b.setAttribute("aria-pressed",k===key);
    b.onclick=()=>{key=k;stage="offer";amt=Math.min(amt,p().max);repaid=0;days=0;last="";render()};$("tabs").appendChild(b)}
}
function render(){
  tabs();$("app").textContent=p().app;
  const d=p(),b=$("body");
  if(stage==="offer"){
    const est=Math.ceil(total()/(d.daily*d.share/100));
    b.innerHTML=`<h2>You can borrow up to</h2><div class="big">${fmt(d.max)}</div>
    <label for="sl" class="note">How much do you need?</label>
    <input type="range" id="sl" min="50000" max="${d.max}" step="10000" value="${amt}">
    <div class="rows">
     <div><span>You receive</span><b id="r1">${fmt(amt)}</b></div>
     <div><span>Fee (5%)</span><b id="r2">${fmt(amt*FEE)}</b></div>
     <div><span>You repay in total</span><b id="r3">${fmt(total())}</b></div>
     <div><span>How you repay</span><b>${d.how}</b></div>
     <div><span>Time to repay at your usual sales</span><b id="r4">about ${est} days</b></div>
    </div>
    <div class="note">Why you were offered this</div><ul>${d.why.map(w=>`<li>${w}</li>`).join("")}</ul>
    <button class="cta" id="go">Take ${fmt(amt)}</button>`;
    const sl=$("sl");
    sl.oninput=()=>{amt=+sl.value;$("r1").textContent=fmt(amt);$("r2").textContent=fmt(amt*FEE);$("r3").textContent=fmt(total());
      $("r4").textContent="about "+Math.ceil(total()/(d.daily*d.share/100))+" days";$("go").textContent="Take "+fmt(amt)};
    $("go").onclick=()=>{stage="active";repaid=0;days=0;last="";render()};
  }else if(stage==="active"){
    const pct=Math.min(100,repaid/total()*100);
    b.innerHTML=`<h2>Repaying your funding</h2><div class="note">${fmt(amt)} received · ${d.how}</div>
    <div class="track" role="progressbar" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><div class="fill" style="width:${pct}%"></div></div>
    <div class="split"><span>${fmt(repaid)} repaid</span><span>${fmt(total()-repaid)} left</span></div>
    <div class="log">${last||"No sales yet. Repayment starts with your next sale."}</div>
    <button class="cta" id="day">Simulate a day of sales</button>`;
    $("day").onclick=()=>{
      const sales=d.daily*(0.7+Math.random()*0.6),take=Math.min(total()-repaid,sales*d.share/100);
      days++;repaid+=take;last=`Day ${days}: ${fmt(take)} taken from ${fmt(sales)} in sales`;
      if(total()-repaid<1){repaid=total();stage="done"}render()};
  }else{
    b.innerHTML=`<h2 class="ok">Fully repaid in ${days} days</h2>
    <p class="note" style="margin:6px 0 14px">You paid back ${fmt(total())}. No missed payments, so your limit has grown.</p>
    <div class="note">You can now borrow up to</div><div class="big">${fmt(Math.round(d.max*1.3/10000)*10000)}</div>
    <button class="cta o" id="again">Start over</button>`;
    $("again").onclick=()=>{stage="offer";repaid=0;days=0;last="";render()};
  }
}
render();
</script>
</body>
</html>
